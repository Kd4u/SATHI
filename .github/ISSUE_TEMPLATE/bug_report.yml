name: Bug report
description: Report a reproducible SATHI problem
title: "[Bug]: "
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iPhone, iPad, Mac, Android, Cloud sync, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/build and OS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Never attach credentials or private account exports.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or relevant logs
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed private information and did not clear app storage to troubleshoot.
          required: true
