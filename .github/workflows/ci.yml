name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check public source
        run: python3 scripts/check_public_source.py
      - name: Build, lint and test
        working-directory: android
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
  apple-domain:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: xcrun swift --version
      - name: Test local domain models
        run: apple/SyncChecks/run.sh
